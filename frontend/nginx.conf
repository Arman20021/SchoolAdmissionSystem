
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for HTML entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
